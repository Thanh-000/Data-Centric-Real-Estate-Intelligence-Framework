name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive framework docs
        uses: actions/upload-artifact@v4
        with:
          name: dc-reif-framework-docs
          path: |
            README.md
            docs/
